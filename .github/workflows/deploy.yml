name: Deploy to Bloxity

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Determine deploy channel
        id: channel
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "channel=prod" >> "$GITHUB_OUTPUT"
          else
            echo "channel=dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        env:
          VITE_SERVER_URL_DEV: ${{ secrets.VITE_SERVER_URL_DEV }}
          VITE_SERVER_URL_MAIN: ${{ secrets.VITE_SERVER_URL_MAIN }}
        run: |
          if [ "${{ steps.channel.outputs.channel }}" = "prod" ]; then
            npm run build
          else
            npm run build:dev
          fi

      - name: Zip build
        run: cd dist && zip -r ../build.zip . && cd ..

      - name: Upload to Bloxity
        run: |
          curl -sS -f -X POST \
            "https://api.bloxity.io/v1/hosting/games/${{ vars.LEGION_GAME_ID }}/frontend?channel=${{ steps.channel.outputs.channel }}&version=${{ github.sha }}" \
            -H "Authorization: Bearer ${{ secrets.LEGION_DEPLOY_TOKEN }}" \
            -H "Content-Type: application/zip" \
            --data-binary @build.zip \
            -w "\nHTTP status: %{http_code}\n"
